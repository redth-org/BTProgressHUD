name: Release NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runId:
        description: "The run id of the GitHub Action Run to publish artifacts from"
        required: false
        default: '-1'

jobs:
  nuget-publish:
    runs-on: windows-latest
    permissions:
      id-token: write   # GitHub OIDC token for nuget.org Trusted Publishing
      actions: read     # download artifacts from build.yml runs
      contents: read
      packages: write   # push to GitHub Packages
    steps:
    - name: Download specific artifact
      if: ${{ github.event.inputs.runId > 0 }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        # run_id can't be combined with branch/commit/pr in this action
        run_id: ${{ github.event.inputs.runId }}

    # On release events there are no inputs (runId is null, which compares as 0), so this must
    # also cover that case; otherwise neither download step runs and there is nothing to push.
    - name: Download latest artifact
      if: ${{ !(github.event.inputs.runId > 0) }}
      uses: dawidd6/action-download-artifact@v6
      with:
        workflow: build.yml
        branch: main
      
    # Trusted Publishing: exchange the OIDC token for a short-lived (1 hour) nuget.org API key.
    # Requires a Trusted Publishing policy on nuget.org for redth-org/BTProgressHUD, workflow file release-nuget.yml.
    - name: NuGet login (OIDC -> temporary API key)
      id: nuget-login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: redth # nuget.org username (profile name) of the policy creator

    - shell: pwsh
      name: Publish NuGet Package
      run: dotnet nuget push **/*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

    - shell: pwsh
      name: Publish NuGet Package (GitHub)
      run: |
        dotnet nuget add source "https://nuget.pkg.github.com/redth-org/index.json" -n "Github" -u redth-org -p ${{ secrets.GITHUB_TOKEN }}
        dotnet nuget push **/*.nupkg -s "Github" --no-symbols --skip-duplicate